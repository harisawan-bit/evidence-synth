[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-synth"
version = "0.2.0"
description = "Evidence Synthesis Automation Framework - PRISMA-compliant systematic review pipeline: search, dedup, AI screening, data extraction, and meta-analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehvar / RCC" }]
keywords = ["systematic-review", "meta-analysis", "PRISMA", "evidence-synthesis", "research-automation", "literature-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "requests>=2.28",
    "scipy>=1.9",
    "numpy>=1.23",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
evidence-synth = "evidence_synth.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_synth*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# A focused, behavior-preserving rule set: import hygiene, unused/broken
# imports, safe modernizations, and a few quality rules.
select = ["E4", "E7", "E9", "F", "I", "FURB", "RUF", "B", "PLR0402"]
# E501: long lines (e.g. the regex in extraction.py) are acceptable here.
# B008/B904: no call-in-default-arg / raise-without-cause patterns to police.
# RUF059/ISC004: cosmetic unpacking / implicit-string-concat edge cases.
ignore = ["E501", "B008", "B904", "RUF059", "ISC004", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["evidence_synth"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0402"]
